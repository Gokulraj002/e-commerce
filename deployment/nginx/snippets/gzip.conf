# =============================================================================
# gzip.conf
# -----------------------------------------------------------------------------
# Gzip compression tuned for a mix of API JSON responses and hashed SPA
# bundles (JS/CSS/SVG). Images (jpeg/png/webp) are already compressed and are
# deliberately excluded — recompressing them wastes CPU with no size win.
#
# Included via:  `include snippets/gzip.conf;`  inside a `server {}` block
# (or once inside the main `http {}` block if you prefer site-wide gzip).
# =============================================================================

gzip on;

# Emit `Vary: Accept-Encoding` so intermediary caches and CDNs store the
# gzipped and non-gzipped variants separately.
gzip_vary on;

# Do not bother compressing tiny payloads — the header overhead can exceed the
# saving. 256 bytes is a safe floor for JSON/HTML.
gzip_min_length 256;

# Compress responses even when the request came via a proxy (needed if a CDN
# or upstream LB sits in front of NGINX). "any" is safe here because static
# assets are already fingerprinted and the API is behind auth.
gzip_proxied any;

# Level 6 is the standard time/ratio sweet spot for on-the-fly compression.
gzip_comp_level 6;

# Skip gzip for ancient IE6 (still occasionally in bot fleets) which had a
# broken gzip implementation.
gzip_disable "msie6";

# MIME types to compress. `text/html` is always compressed implicitly — the
# list below covers CSS, JS bundles, JSON API responses, SVG, fonts and
# manifests. Add types here only when you know they are text-based.
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    application/manifest+json
    application/vnd.api+json
    application/wasm
    image/svg+xml
    image/x-icon
    font/ttf
    font/otf
    font/eot
    application/font-woff
    application/font-woff2;

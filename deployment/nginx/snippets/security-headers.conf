# =============================================================================
# security-headers.conf
# -----------------------------------------------------------------------------
# Baseline security headers applied to every HTTPS response.
#
# Included via:  `include snippets/security-headers.conf;`  inside a `server {}`
# block (or inside a specific `location {}` when you want a narrower scope).
#
# NOTE ON `add_header` INHERITANCE:
#   NGINX resets inherited `add_header` directives as soon as ANY new
#   `add_header` appears in a nested `location {}`. If you add per-location
#   headers, re-include this snippet in that location as well, otherwise the
#   security headers below will silently disappear from that location's
#   responses. `always` is used so headers are attached even to 4xx/5xx.
# =============================================================================

# ---- Clickjacking protection -------------------------------------------------
# Allow framing only from the same origin (embedded admin previews, iframes,
# payment gateway callbacks that render inside our own domain). Deny cross-site
# framing entirely.
add_header X-Frame-Options "SAMEORIGIN" always;

# ---- MIME sniffing protection ------------------------------------------------
# Force browsers to honour the declared Content-Type. Prevents a JSON/HTML/JS
# response from being reinterpreted as another type.
add_header X-Content-Type-Options "nosniff" always;

# ---- Referrer policy ---------------------------------------------------------
# Send the full referrer only to same-origin destinations; send just the origin
# (no path/query) on cross-origin HTTPS requests; send nothing on downgrade.
# Balances analytics needs with user privacy.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ---- Permissions Policy ------------------------------------------------------
# Explicitly disable powerful browser APIs we do not use. Reduces the blast
# radius of any injected third-party script (e.g. compromised analytics tag).
# Add features here (with "=(self)") only when the app actually needs them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# ---- HSTS (HTTP Strict Transport Security) -----------------------------------
# Tell browsers to always use HTTPS for this hostname (and every subdomain) for
# the next 2 years, and mark us eligible for the browser preload list.
#
# IMPORTANT: only enable AFTER certificates are issued and HTTPS is verified
# stable — a broken cert with HSTS active will lock users out until max-age
# expires. If in doubt during the first cert rollout, comment this line, deploy,
# verify HTTPS works, then uncomment on the next reload.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

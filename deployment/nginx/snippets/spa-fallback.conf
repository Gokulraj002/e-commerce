# =============================================================================
# spa-fallback.conf
# -----------------------------------------------------------------------------
# SPA (Single Page Application) client-side routing fallback.
#
# The React build ships one `index.html` plus hashed assets under `/assets/`.
# When a user deep-links to e.g. `/orders/12345` or refreshes on that URL,
# there is no `orders/12345` file on disk — NGINX must serve `index.html` and
# let the client-side router render the correct view.
#
# Included via:  `include snippets/spa-fallback.conf;`  inside a `location / {}`
# in the customer/admin server blocks.
#
# ORDERING RULE: this snippet must come AFTER any long-cache `location /assets/`
# block, otherwise the static-asset location will still win by longest prefix.
# =============================================================================

# ---- Deep-link fallback ------------------------------------------------------
# Try the exact file first, then the directory (for the rare index case), then
# fall through to `/index.html`. NGINX serves `index.html` with a 200 (not a
# 302 redirect) so the URL bar stays intact for the client router.
try_files $uri $uri/ /index.html;

# ---- Never cache the HTML shell ----------------------------------------------
# The SPA shell references hashed JS/CSS bundles. If a browser or intermediary
# caches an old `index.html`, users will keep loading stale bundle URLs after
# a deploy. Force revalidation on every request for the shell only — the
# hashed `/assets/*` are still cached for a year (see the sites-available
# configs) so this costs almost nothing in bytes.
location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
    # Re-include security headers here — `add_header` inheritance is reset the
    # moment we declare one inside a nested location.
    include snippets/security-headers.conf;
}

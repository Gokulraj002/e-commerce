# =============================================================================
# proxy-api.conf
# -----------------------------------------------------------------------------
# Reverse-proxy settings for forwarding requests to the Node/Express API.
# The Node process binds to 127.0.0.1:4000 (loopback only — never exposed to
# the internet) and runs under PM2 in cluster mode.
#
# Included via:  `include snippets/proxy-api.conf;`  inside a `location {}`
# that has already selected the request paths destined for the API
# (typically `location /api/ { ... }`).
#
# UPSTREAM: this snippet proxies to the named upstream `elite_api`, which is
# defined in `deployment/nginx/nginx.conf`. If you are NOT including that
# main-config snippet, either add the upstream yourself in the `http {}`
# context or change the `proxy_pass` line below to
# `proxy_pass http://127.0.0.1:4000;` and drop the keepalive benefit.
# =============================================================================

# ---- Upstream target ---------------------------------------------------------
# No trailing slash: NGINX forwards the request URI unchanged. The Node app
# owns the API prefix (`/api/v1`, from backend/src/config/env.ts), so a
# request to `/api/v1/products` reaches the backend as `/api/v1/products`.
proxy_pass http://elite_api;

# ---- HTTP/1.1 to the upstream ------------------------------------------------
# Required for keepalive to the upstream and for WebSocket upgrades below.
proxy_http_version 1.1;

# ---- Forwarded headers -------------------------------------------------------
# Preserve the original Host so the backend can build correct absolute URLs
# (invoice links, password-reset emails, OG tags in SSR-rendered fragments).
proxy_set_header Host              $host;

# Real client IP for logging, rate-limiting, geolocation, fraud checks.
proxy_set_header X-Real-IP         $remote_addr;

# Standard forwarding chain — appends this hop to any existing header, so a
# request that transited a CDN/LB keeps the full chain intact.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# The backend uses this to know it is behind TLS (secure-cookie flags,
# https:// links in payment redirects, HSTS enforcement).
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Correlation ID passthrough: the API generates X-Request-Id in its request
# logger; if the client (or an edge/CDN) has already sent one, keep it so a
# single request can be traced end-to-end.
proxy_set_header X-Request-Id      $http_x_request_id;

# ---- WebSocket / Server-Sent Events upgrade ----------------------------------
# The `$connection_upgrade` variable is defined in nginx.conf via a `map`
# from `$http_upgrade`. This lets the same location transparently serve both
# regular HTTP requests AND WebSocket upgrades (used by BullMQ dashboards,
# live order-status pushes to admin, etc.). Non-upgrade requests get an empty
# Connection header, which is what NGINX expects.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# ---- Timeouts ----------------------------------------------------------------
# 60 seconds each way matches the Node app's default request timeout and is
# comfortable for the slowest endpoints (bulk product imports, PDF invoice
# generation). Bump `proxy_read_timeout` for long-running admin exports if
# needed — do NOT bump it globally, only for the specific export location.
proxy_connect_timeout 60s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# ---- Response buffering ------------------------------------------------------
# Buffer upstream responses so a slow client cannot tie up a Node worker.
# The 8k header buffer is generous enough for JWTs + Set-Cookie chains.
proxy_buffering       on;
proxy_buffers         16 8k;
proxy_buffer_size     8k;
proxy_busy_buffers_size 16k;

# ---- Redirect rewriting ------------------------------------------------------
# If the upstream ever issues a redirect pointing at http://127.0.0.1:4000/...
# rewrite it back to the public host so browsers do not follow the loopback.
proxy_redirect off;

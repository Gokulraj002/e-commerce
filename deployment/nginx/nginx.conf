# =============================================================================
# nginx.conf  (optional main-config snippet)
# -----------------------------------------------------------------------------
# Drop-in additions for the `main` and `http {}` contexts of NGINX. Two ways
# to consume this file:
#
#   (a) Copy the directives below into the matching sections of the distro
#       default `/etc/nginx/nginx.conf`. Recommended for shared hosts where
#       other apps also live on NGINX.
#
#   (b) Replace `/etc/nginx/nginx.conf` outright with a version that sources
#       this file — only do this on a VPS dedicated to Elite NonVeg.
#
# It contains ONLY the settings that must live outside a `server {}` block:
#     - worker sizing
#     - global sendfile / tcp tuning
#     - the `$connection_upgrade` map used by proxy-api.conf
#     - the shared `upstream elite_api { ... }` block
#     - request-body size cap
#     - the `include sites-enabled/*` line so per-site configs load
#
# Per-site server blocks live in `deployment/nginx/sites-available/` and are
# enabled by symlinking into `/etc/nginx/sites-enabled/` (see README).
# =============================================================================

# ---- Worker process model ----------------------------------------------------
# One worker per CPU core; NGINX will detect the core count at boot.
worker_processes auto;

# Log worker startup/shutdown and unrecoverable errors. Access logs are
# configured per-server in each site file.
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    # Per-worker connection ceiling. 4 workers x 4096 = ~16k concurrent
    # connections, comfortable headroom for a Phase-1 storefront and enough
    # to survive a modest promotional spike without tuning.
    worker_connections 4096;

    # Accept as many new connections as possible in a single epoll tick —
    # slightly better throughput under bursty load.
    multi_accept on;

    # Linux-native event model. Explicit for clarity; NGINX picks this by
    # default on Ubuntu.
    use epoll;
}

http {
    # ---- MIME + charset ------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # ---- Log format ----------------------------------------------------------
    # Extended combined + upstream latency + request id (for correlating an
    # NGINX line with the matching API log line). $request_time is total wall
    # time NGINX spent on the request; $upstream_response_time is time spent
    # waiting on the Node backend only.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rid=$http_x_request_id rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    # ---- Transport tuning ----------------------------------------------------
    # sendfile: kernel-space file transfer for static assets (SPA bundles).
    sendfile        on;
    # Send response headers together with the sendfile chunk (TCP_CORK).
    tcp_nopush      on;
    # Flush small writes immediately instead of waiting for Nagle — better
    # perceived latency for API JSON responses.
    tcp_nodelay     on;

    # Keep idle client connections open long enough to serve the next asset
    # in a page-load burst without re-handshaking TLS.
    keepalive_timeout  65s;
    keepalive_requests 1000;

    # Hide the exact NGINX version from `Server:` response headers.
    server_tokens off;

    # ---- Request body cap ----------------------------------------------------
    # 10 MB accommodates product images, batch CSV imports and multi-page
    # invoice attachments, while rejecting obvious DoS-shaped uploads at the
    # edge before they ever hit Node. Override per-location for endpoints
    # that specifically need larger uploads.
    client_max_body_size 10m;
    client_body_timeout  30s;
    client_header_timeout 15s;
    send_timeout         30s;

    # ---- WebSocket upgrade map ----------------------------------------------
    # Referenced by snippets/proxy-api.conf. Maps the client's `Upgrade`
    # header to the correct value for the outbound `Connection` header.
    # Empty (default) for regular HTTP → NGINX drops Connection: upgrade
    # instead of forwarding it, which is what pooled backends expect.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- Upstream: Node/Express API (PM2 cluster on loopback) ---------------
    # PM2 fans out to one process per CPU core; all listen on 127.0.0.1:4000
    # via the shared-port mechanism, so a single upstream target reaches the
    # whole cluster. `keepalive` reuses upstream connections between requests,
    # which meaningfully cuts syscall overhead for JSON-heavy API traffic.
    upstream elite_api {
        server 127.0.0.1:4000;
        keepalive 32;
    }

    # ---- Gzip (global default) ----------------------------------------------
    # Included here so every site inherits compression without repeating the
    # snippet in each server block. Individual server blocks may still
    # include it again for clarity — it is idempotent.
    include /etc/nginx/snippets/gzip.conf;

    # ---- Per-site server blocks ---------------------------------------------
    # Standard Debian/Ubuntu convention: files in sites-available/ take
    # effect only when symlinked into sites-enabled/.
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}

# =============================================================================
# elitenonveg-admin.conf — Back-office admin SPA
# -----------------------------------------------------------------------------
# server_name : admin.elitenonveg.com
# doc-root    : /var/www/elite/admin   (React admin build output)
# TLS certs   : Let's Encrypt via certbot   (admin.elitenonveg.com)
# API         : /api/  → reverse-proxied to the same Node upstream `elite_api`
#
# Structure mirrors the customer site (elitenonveg.conf) — same snippets, same
# caching strategy, different hostname and doc-root. This gives operators one
# mental model to maintain both sites.
#
# HARDENING NOTES (not applied by default — enable when ready):
#   - Uncomment the `allow`/`deny` block to restrict admin access to a
#     known office/VPN IP range.
#   - Consider adding HTTP Basic Auth on top of the app's JWT login for
#     early-life staging environments.
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP :80  →  301 to HTTPS  (+ ACME challenge)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.elitenonveg.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS :443  →  Admin SPA + /api proxy
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.elitenonveg.com;

    # ---- TLS --------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/admin.elitenonveg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.elitenonveg.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Access log -------------------------------------------------------
    access_log /var/log/nginx/elitenonveg-admin.access.log main;
    error_log  /var/log/nginx/elitenonveg-admin.error.log warn;

    # ---- (Optional) IP allow-list ----------------------------------------
    # Uncomment and adjust to lock admin down to office / VPN IPs. Keep the
    # ACME challenge open on port 80 above so cert renewals still work.
    #
    # allow 203.0.113.0/24;       # office network
    # allow 198.51.100.42;        # ops VPN gateway
    # deny  all;

    # ---- Static SPA root --------------------------------------------------
    root /var/www/elite/admin;
    index index.html;

    # ---- Global response tuning ------------------------------------------
    include snippets/security-headers.conf;
    include snippets/gzip.conf;

    # ---- API reverse-proxy ------------------------------------------------
    # The admin app calls the same backend on the same version prefix
    # (`/api/v1/...`). Sharing the upstream keeps a single source of truth.
    location /api/ {
        include snippets/proxy-api.conf;
    }

    # ---- Health check passthrough (optional) ------------------------------
    location = /health {
        access_log off;
        include snippets/proxy-api.conf;
    }

    # ---- Hashed static assets — long-cache, immutable ---------------------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ---- Small root-level static files -----------------------------------
    location = /favicon.ico   { access_log off; log_not_found off; expires 1d; }
    location = /robots.txt    { access_log off; log_not_found off; expires 1d; }
    location = /manifest.json { access_log off;                    expires 1d; }

    # ---- SPA fallback -----------------------------------------------------
    location / {
        include snippets/spa-fallback.conf;
    }
}

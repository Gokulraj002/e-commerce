# =============================================================================
# elitenonveg-hostinger.conf — Customer storefront, shared-VPS bootstrap mode
# -----------------------------------------------------------------------------
# This VPS already runs Traefik (Docker) bound to 0.0.0.0:80 and 0.0.0.0:443
# for other projects (n8n, etc.), so this site does NOT compete for 80/443.
# It listens on its own port instead:
#
#     http://<VPS_IP>:8081/
#
# server_name : _ (catch-all — no domain yet)
# doc-root    : /var/www/elite/frontend
# TLS         : none (bare IP + alternate port — no cert authority can issue
#               for this). Once a domain exists, either (a) add Elite as a
#               new router/service inside the EXISTING Traefik instance so it
#               can own 80/443 for a real hostname, or (b) if 80/443 are ever
#               freed up, switch to elitenonveg.conf + certbot instead.
# API         : /api/ → reverse-proxied to the Node upstream `elite_api`
# =============================================================================

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    # ---- Access log ---------------------------------------------------------
    access_log /var/log/nginx/elitenonveg-hostinger.access.log main;
    error_log  /var/log/nginx/elitenonveg-hostinger.error.log warn;

    # ---- Static SPA root ------------------------------------------------------
    root /var/www/elite/frontend;
    index index.html;

    # ---- Global response tuning ------------------------------------------------
    include snippets/security-headers.conf;
    include snippets/gzip.conf;

    # ---- API reverse-proxy ------------------------------------------------------
    location /api/ {
        include snippets/proxy-api.conf;
    }

    location = /health {
        access_log off;
        include snippets/proxy-api.conf;
    }

    # ---- Hashed static assets — long-cache, immutable --------------------------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /favicon.ico   { access_log off; log_not_found off; expires 1d; }
    location = /robots.txt    { access_log off; log_not_found off; expires 1d; }
    location = /manifest.json { access_log off;                    expires 1d; }

    # ---- SPA fallback -----------------------------------------------------------
    location / {
        include snippets/spa-fallback.conf;
    }
}

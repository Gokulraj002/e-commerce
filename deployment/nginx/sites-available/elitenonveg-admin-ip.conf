# =============================================================================
# elitenonveg-admin-ip.conf — Admin SPA, NO-DOMAIN / IP-ONLY bootstrap mode
# -----------------------------------------------------------------------------
# Use this INSTEAD of elitenonveg-admin.conf until a domain is pointed at the
# VPS. There is only one IP and no hostname to distinguish customer vs admin,
# so the admin panel is served on its OWN PORT instead:
#
#     http://<VPS_IP>:8080/
#
# doc-root : /var/www/elite/admin
# TLS      : none (see elitenonveg-ip.conf for why)
# API      : /api/ → same Node upstream `elite_api` as the storefront
#
# SECURITY NOTE: an admin panel on a bare HTTP port is fine for initial setup
# and testing, but before real staff logins happen daily, either (a) attach a
# domain and switch to elitenonveg-admin.conf + certbot, or (b) uncomment the
# IP allow-list below to restrict :8080 to your own office/home IP.
# =============================================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # ---- Access log ---------------------------------------------------------
    access_log /var/log/nginx/elitenonveg-admin-ip.access.log main;
    error_log  /var/log/nginx/elitenonveg-admin-ip.error.log warn;

    # ---- (Optional) IP allow-list --------------------------------------------
    # allow 203.0.113.42;   # your home/office IP
    # deny  all;

    # ---- Static SPA root ------------------------------------------------------
    root /var/www/elite/admin;
    index index.html;

    # ---- Global response tuning ------------------------------------------------
    include snippets/security-headers.conf;
    include snippets/gzip.conf;

    # ---- API reverse-proxy ------------------------------------------------------
    location /api/ {
        include snippets/proxy-api.conf;
    }

    location = /health {
        access_log off;
        include snippets/proxy-api.conf;
    }

    # ---- Hashed static assets — long-cache, immutable --------------------------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /favicon.ico   { access_log off; log_not_found off; expires 1d; }
    location = /robots.txt    { access_log off; log_not_found off; expires 1d; }
    location = /manifest.json { access_log off;                    expires 1d; }

    # ---- SPA fallback -----------------------------------------------------------
    location / {
        include snippets/spa-fallback.conf;
    }
}

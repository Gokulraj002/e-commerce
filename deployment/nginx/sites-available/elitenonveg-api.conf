# =============================================================================
# elitenonveg-api.conf  (OPTIONAL)
# -----------------------------------------------------------------------------
# server_name : api.elitenonveg.com
# upstream    : elite_api (127.0.0.1:4000, defined in nginx.conf)
#
# This file is NOT required in the "one storefront, one admin" layout —
# the customer and admin sites already proxy `/api/` internally, so the
# frontend can call `/api/v1/...` on the same origin and the browser will
# never see the API domain.
#
# Enable this file (symlink into sites-enabled/) when any of the following
# is true:
#   - Mobile apps / third-party integrators need a stable API hostname that
#     is decoupled from the storefront domain.
#   - Payment gateway webhooks (Razorpay, PhonePe, Cashfree) are configured
#     to POST to `https://api.elitenonveg.com/...` — recommended so the
#     public storefront and webhook receiver can be tuned independently.
#   - You want to apply stricter rate-limits, IP allow-lists or WAF rules
#     to the API without touching the customer site.
#
# Everything on this hostname is proxied to the Node backend — there is
# no static content and no SPA fallback here.
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP :80  →  301 to HTTPS  (+ ACME challenge)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.elitenonveg.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS :443  →  full proxy to Node upstream
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.elitenonveg.com;

    # ---- TLS --------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/api.elitenonveg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.elitenonveg.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Access log -------------------------------------------------------
    access_log /var/log/nginx/elitenonveg-api.access.log main;
    error_log  /var/log/nginx/elitenonveg-api.error.log warn;

    # ---- Body cap ---------------------------------------------------------
    # Bumped slightly above the global default because the API accepts CSV
    # imports and multi-image product uploads. Adjust upward with care —
    # anything larger should probably go straight to S3 via a signed URL.
    client_max_body_size 15m;

    # ---- Baseline security headers ---------------------------------------
    include snippets/security-headers.conf;

    # ---- gzip for JSON payloads ------------------------------------------
    include snippets/gzip.conf;

    # ---- CORS (optional; usually handled by Express itself) --------------
    # The Node app already sets CORS via `env.corsOrigins` in
    # backend/src/config/env.ts. Duplicating CORS at NGINX will cause
    # conflicts — leave it commented unless you deliberately want NGINX
    # to short-circuit OPTIONS preflight.
    #
    # if ($request_method = OPTIONS) {
    #     add_header Access-Control-Allow-Origin  "$http_origin" always;
    #     add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    #     add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id" always;
    #     add_header Access-Control-Max-Age       "600" always;
    #     return 204;
    # }

    # ---- Deny direct browsing of the API root ----------------------------
    # A GET on `/` is almost certainly a mistaken poke — return an empty
    # 404 rather than proxying a useless request to Node.
    location = / {
        return 404;
    }

    # ---- Health check ----------------------------------------------------
    # Kept as its own location so uptime monitors' hits do not pollute the
    # main access log. Backend exposes GET /health checking DB + Redis.
    location = /health {
        access_log off;
        include snippets/proxy-api.conf;
    }

    # ---- Catch-all proxy -------------------------------------------------
    # Everything else — /api/v1/*, /webhooks/*, /admin/* — flows straight
    # to the Node cluster with no path rewriting.
    location / {
        include snippets/proxy-api.conf;
    }
}

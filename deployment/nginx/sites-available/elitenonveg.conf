# =============================================================================
# elitenonveg.conf — Customer storefront
# -----------------------------------------------------------------------------
# server_name : elitenonveg.com, www.elitenonveg.com
# doc-root    : /var/www/elite/frontend   (React SPA build output)
# TLS certs   : Let's Encrypt via certbot   (elitenonveg.com + www.)
# API         : /api/  → reverse-proxied to the Node upstream `elite_api`
#               (defined in deployment/nginx/nginx.conf)
#
# The backend owns the versioned prefix `/api/v1` (see backend/src/config/env.ts,
# API_PREFIX). NGINX proxies the entire `/api/` subtree unchanged so both
# `/api/v1/...` today and `/api/v2/...` in the future flow through without
# an NGINX change.
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP :80  →  301 to HTTPS
# -----------------------------------------------------------------------------
# The only two paths served on port 80 are:
#   1. The ACME HTTP-01 challenge (`/.well-known/acme-challenge/`) so certbot
#      can renew certificates without downtime.
#   2. Everything else → permanent redirect to the HTTPS canonical hostname.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name elitenonveg.com www.elitenonveg.com;

    # Serve the ACME challenge files from a well-known, writable path.
    # certbot's --nginx plugin manages this automatically; the explicit
    # block makes standalone `certbot certonly --webroot` also work.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else is redirected. 301 (permanent) so browsers cache it.
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS :443  →  Customer SPA + /api proxy
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elitenonveg.com www.elitenonveg.com;

    # ---- TLS ---------------------------------------------------------------
    # Let's Encrypt live/ paths. Certbot's --nginx installer writes these in
    # automatically; they are shown explicitly so an operator can reason
    # about renewals and back them up.
    ssl_certificate     /etc/letsencrypt/live/elitenonveg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elitenonveg.com/privkey.pem;

    # Modern-only cipher policy — matches the Mozilla "intermediate" profile.
    # TLS 1.0/1.1 are disabled entirely.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Access log -------------------------------------------------------
    access_log /var/log/nginx/elitenonveg.access.log main;
    error_log  /var/log/nginx/elitenonveg.error.log warn;

    # ---- Static SPA root --------------------------------------------------
    root /var/www/elite/frontend;
    index index.html;

    # ---- Global response tuning ------------------------------------------
    include snippets/security-headers.conf;
    include snippets/gzip.conf;

    # ---- API reverse-proxy ------------------------------------------------
    # First-match by longest prefix: this location wins over `location /`
    # for any URL beginning with `/api/`, and forwards to the Node cluster.
    location /api/ {
        include snippets/proxy-api.conf;
    }

    # ---- Health check passthrough (optional) ------------------------------
    # The backend exposes GET /health for uptime monitors and load balancers.
    # Proxying it here lets external monitors ping the public hostname
    # instead of needing loopback access.
    location = /health {
        access_log off;
        include snippets/proxy-api.conf;
    }

    # ---- Hashed static assets — long-cache, immutable ---------------------
    # Vite/webpack emit filenames like `app.9f3a2b.js` under `/assets/`. Every
    # deploy produces a new hash, so it is safe to tell browsers and CDNs to
    # keep the file forever. `immutable` skips revalidation entirely.
    #
    # IMPORTANT: keep this BEFORE the SPA fallback location, so the longest
    # matching prefix (`/assets/`) is chosen for asset requests.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        # Re-apply security headers — see the note in security-headers.conf.
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ---- Small root-level static files (favicon, robots, manifest) -------
    # These are NOT hashed but change rarely, so cache for a day.
    location = /favicon.ico   { access_log off; log_not_found off; expires 1d; }
    location = /robots.txt    { access_log off; log_not_found off; expires 1d; }
    location = /manifest.json { access_log off;                    expires 1d; }

    # ---- SPA fallback + no-cache index.html -------------------------------
    # Any URL that is not a real file and not `/api/*` returns the React
    # shell so client-side routing can take over. Included last so it acts
    # as the catch-all.
    location / {
        include snippets/spa-fallback.conf;
    }
}

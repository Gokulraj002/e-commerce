# =============================================================================
# elitenonveg-admin-hostinger.conf — Admin SPA, shared-VPS bootstrap mode
# -----------------------------------------------------------------------------
# Companion to elitenonveg-hostinger.conf. Traefik already owns 80/443 on this
# box, so the admin panel gets its own port too:
#
#     http://<VPS_IP>:8082/
#
# doc-root : /var/www/elite/admin
# TLS      : none (see elitenonveg-hostinger.conf for why)
# API      : /api/ → same Node upstream `elite_api` as the storefront
#
# SECURITY NOTE: consider the IP allow-list below once you know which IP you
# administer from, since this is a bare HTTP admin login on a public port.
# =============================================================================

server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    # ---- Access log ---------------------------------------------------------
    access_log /var/log/nginx/elitenonveg-admin-hostinger.access.log main;
    error_log  /var/log/nginx/elitenonveg-admin-hostinger.error.log warn;

    # ---- (Optional) IP allow-list ----------------------------------------
    # allow 203.0.113.42;   # your home/office IP
    # deny  all;

    # ---- Static SPA root ------------------------------------------------------
    root /var/www/elite/admin;
    index index.html;

    # ---- Global response tuning ------------------------------------------------
    include snippets/security-headers.conf;
    include snippets/gzip.conf;

    # ---- API reverse-proxy ------------------------------------------------------
    location /api/ {
        include snippets/proxy-api.conf;
    }

    location = /health {
        access_log off;
        include snippets/proxy-api.conf;
    }

    # ---- Hashed static assets — long-cache, immutable --------------------------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /favicon.ico   { access_log off; log_not_found off; expires 1d; }
    location = /robots.txt    { access_log off; log_not_found off; expires 1d; }
    location = /manifest.json { access_log off;                    expires 1d; }

    # ---- SPA fallback -----------------------------------------------------------
    location / {
        include snippets/spa-fallback.conf;
    }
}

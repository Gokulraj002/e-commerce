# =============================================================================
# elitenonveg-ip.conf — Customer storefront, NO-DOMAIN / IP-ONLY bootstrap mode
# -----------------------------------------------------------------------------
# Use this INSTEAD of elitenonveg.conf until a domain is pointed at the VPS.
# server_name : _ (catch-all — matches the bare public IP, e.g. http://IP/)
# doc-root    : /var/www/elite/frontend
# TLS         : none (plain HTTP — Let's Encrypt cannot issue a cert for a
#               bare IP address). Migrate to elitenonveg.conf + certbot the
#               day a domain is attached; see deployment/README.md.
# API         : /api/ → reverse-proxied to the Node upstream `elite_api`
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ---- Access log ---------------------------------------------------------
    access_log /var/log/nginx/elitenonveg-ip.access.log main;
    error_log  /var/log/nginx/elitenonveg-ip.error.log warn;

    # ---- Static SPA root ------------------------------------------------------
    root /var/www/elite/frontend;
    index index.html;

    # ---- Global response tuning ------------------------------------------------
    include snippets/security-headers.conf;
    include snippets/gzip.conf;

    # ---- API reverse-proxy ------------------------------------------------------
    location /api/ {
        include snippets/proxy-api.conf;
    }

    location = /health {
        access_log off;
        include snippets/proxy-api.conf;
    }

    # ---- Hashed static assets — long-cache, immutable --------------------------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /favicon.ico   { access_log off; log_not_found off; expires 1d; }
    location = /robots.txt    { access_log off; log_not_found off; expires 1d; }
    location = /manifest.json { access_log off;                    expires 1d; }

    # ---- SPA fallback -----------------------------------------------------------
    location / {
        include snippets/spa-fallback.conf;
    }
}
